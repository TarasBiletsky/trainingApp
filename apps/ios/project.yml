name: TrainingApp
options:
  bundleIdPrefix: dev.taras
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  TrainingApp:
    type: application
    platform: iOS
    sources: [TrainingApp]
    info:
      path: TrainingApp/Info.plist
      properties:
        NSHealthShareUsageDescription: "Вес, активность и восстановление используются для анализа тренировок."
        NSLocalNetworkUsageDescription: "Локальная сеть нужна для подключения к личному серверу тренировок."
        NSAppTransportSecurity:
          NSExceptionDomains:
            192.168.31.45:
              NSExceptionAllowsInsecureHTTPLoads: true
            100.67.143.48:
              NSExceptionAllowsInsecureHTTPLoads: true
    entitlements:
      path: TrainingApp/TrainingApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.taras.TrainingApp
        PRODUCT_NAME: Training
